[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/extract"
  to = "/.netlify/functions/extract"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
